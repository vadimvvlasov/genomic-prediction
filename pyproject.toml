[project]
name = "gp-py"
version = "0.1.0"
description = "Python port scaffold for gp genomic prediction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "pyarrow>=16.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "joblib>=1.4",
]

[project.optional-dependencies]
io = [
  "cyvcf2>=0.31",
  "pyreadr>=0.5.0",
]
notebook = [
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.22",
  "tqdm>=4.67.3",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
bayes = [
  "pymc>=5.16",
  "arviz>=0.18",
]
rbridge = [
  "rpy2>=3.5",
]

[project.scripts]
gp-py = "gp_py.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
